spring.config.import=optional:file:.env[.properties]

# Configuration Accès JPA
spring.datasource.url = jdbc:mysql://localhost:3306/istedex?createDatabaseIfNotExist=true
spring.datasource.username = ${SQL_USER}
spring.datasource.password = ${SQL_PWD}

spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true

# Cle secrete JWT fournie par variable d'environnement
# TODO: Récuperer la clé JWT depuis une variable d'envirronement - jwt.key = ${JWT_KEY}
jwt.key = ${JWT_KEY}


