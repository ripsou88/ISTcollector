<header>
  <nav>

    <div class="nav-left">

      <div class="hamburger" (click)="toggleMenu()">
        <svg viewBox="0 0 24 24" class="hamburger-icon">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </div>

      <div class="logo">
        <a [routerLink]="['/home']">
        <img src="img/front/LOGO.png" alt="logo">
        </a>
      </div>

      <div class="search-bar">
        <img src="img/front/Pokeball.png" class="search-icon" alt="search">

        <input
          type="text"
          placeholder="Rechercher une IST..."
          [(ngModel)]="searchTerm"
          (input)="searchIST()"
        >

        <div class="search-results" *ngIf="searchTerm.length > 0">

          <div
            *ngFor="let ist of filteredIST"
            class="result-item"
            (click)="goToIST(ist)"
          >
            {{ ist }}
          </div>

        </div>
      </div>

    </div>

    <!-- MENU -->
    <ul class="nav-menu" [class.open]="menuActive">

      <li><a routerLink="/home" (click)="closeMenu()">ACCUEIL</a></li>
      <li><a routerLink="/prevention" (click)="closeMenu()">PREVENTION</a></li>
      <li *ngIf="isLogged()"><a routerLink="/collection" (click)="closeMenu()">COLLECTION</a></li>
      <li *ngIf="isLogged()"><a routerLink="/quizz" (click)="closeMenu()">QUIZZ</a></li>
      <li><a routerLink="/jeux" (click)="closeMenu()">JEUX</a></li>
      <li *ngIf="!isLogged()"><a routerLink="/connexion" (click)="closeMenu()">CONNEXION</a></li>
      <li *ngIf="isLogged()"><button class="logout-btn" type="button" (click)="logout()">DECONNEXION</button></li>

    </ul>

  </nav>
</header>
