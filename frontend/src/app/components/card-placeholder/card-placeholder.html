<div class="allcarte" #allcarte>
  <div class="carte" #carte>
    <!-- Foil / shimmer / glare layers -->
    <div class="foil" #foil></div>
    <div class="shimmer" #shimmer></div>
    <div class="glare" #glare></div>

    <!-- Corner decorations -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="ligne1">{{ vih.nom }}</div>

    <div class="ligne2">
      <div class="ist-type">{{ typeIstEmoji[vih.typeIst].emoji }}</div>
      <div class="power"><span *ngFor="let star of getStars()">⭐</span></div>
    </div>

    <div class="ligne3"><img [src]="vih.img"/></div>

    <div class="ligne4"><span *ngFor="let t of vih.transmissions">{{ transmissionEmoji[t].emoji }}</span></div>

    <div class="ligne5">{{ vih.desc }}</div>

    <!-- <app-card-popup [ist]="ist()" /> -->
   </div>
</div>
